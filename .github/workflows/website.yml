name: Website

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: official
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: official/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
