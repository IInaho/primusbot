name: Repository quality

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38e # 2.0.0
        with:
          scandir: ./scripts
          version: v0.11.0
      - name: Test installer checksum handling
        run: sh scripts/test-install.sh
      - name: Test CI path classification
        run: sh scripts/test-ci-paths.sh
      - name: Test Star History generator
        run: node --test scripts/update-star-history.test.mjs
