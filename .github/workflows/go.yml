name: Go

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Create portable Linux amd64 Zig CC wrapper
        run: |
          cat > /tmp/zigcc-linux-amd64 <<'EOF'
          #!/bin/sh
          exec zig cc -target x86_64-linux-gnu "$@"
          EOF
          chmod +x /tmp/zigcc-linux-amd64
      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Build
        run: CC=/tmp/zigcc-linux-amd64 go build ./...
      - name: Test
        run: CC=/tmp/zigcc-linux-amd64 go test ./...
      - name: Vet
        run: CC=/tmp/zigcc-linux-amd64 go vet ./...

      # Race detector: agent/contextmgr/runtime are the concurrency-dense core.
      # run separately so failures are attributed to races, not regular tests.
      - name: Race detector
        run: CC=/tmp/zigcc-linux-amd64 go test -race ./bot/... ./runtime/...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interaction/gui/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interaction/gui/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: official
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: official/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38e # 2.0.0
        with:
          scandir: ./scripts
          version: v0.11.0
      - name: Test installer checksum handling
        run: sh scripts/test-install.sh
      - name: Check local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path '(^|/)(node_modules|dist|\.next)(/|$)' --root-dir "${{ github.workspace }}" './**/*.md'
          lycheeVersion: v0.24.2
