name: Go core

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Create portable Linux amd64 Zig CC wrapper
        run: |
          cat > /tmp/zigcc-linux-amd64 <<'EOF'
          #!/bin/sh
          exec zig cc -target x86_64-linux-gnu "$@"
          EOF
          chmod +x /tmp/zigcc-linux-amd64
      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Build
        run: CC=/tmp/zigcc-linux-amd64 go build ./...
      - name: Test
        run: CC=/tmp/zigcc-linux-amd64 go test ./...
      - name: Vet
        run: CC=/tmp/zigcc-linux-amd64 go vet ./...

      # Race detector: agent/contextmgr/runtime are the concurrency-dense core.
      # run separately so failures are attributed to races, not regular tests.
      - name: Race detector
        run: CC=/tmp/zigcc-linux-amd64 go test -race ./bot/... ./runtime/...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
